<!--
Lebar total tanpa box-sizing:
320px + (20px × 2) + (2px × 2) = 364px
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background-color: #f2f2f2;
            font-family: arial, sans-serif;
        }
        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid;
            margin: 30px auto;
            background-color: white;
            border-radius: 8px;
        }
        .card img {
            width: 100%;
            height: 160px;
            display: block;
        }
        .card h3 {
            color: #333;
            margin-bottom: 8px;
            text-align: center;
        }
        .card p {
            font-size: 15px;
        }
        .card a {
            color: #176b45;
        }
        footer {
            text-align: center;
        }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <img src="../assets/images/card.png" alt="Website Natal GKKD 2026">
            <h3>Website Natal GKKD 2026</h3>
            <p>Website ini dibuat untuk menampilkan informasi acara Natal GKKD 2026. Desainnya menggunakan HTML dan CSS dengan tema warna merah dan emas.</p>
            <a href="https://natal-gkkd-pontianak-tahun-2026.netlify.app/">Lihat Proyek</a>
        </div>
    </main>

    <footer>
       <a href="../index.html">Kembali ke Beranda</a>
    </footer>
    
</body>
</html>
