<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button-set</title>
    <style>
      body {
        background-color: whitesmoke;
        font-family: Arial, sans-serif;
      }
      h2 {
        color: rgb(30, 30, 47);
        font-size: 20px;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        font-weight: bold;
        margin-right: 10px;
        margin-bottom: 10px;
        border-radius: 8px;
      }
      .button-group {
        margin-right: 10px;
        margin-bottom: 10px;
      }
      .btn-secondary,
      .btn-outline {
        color: rgba(52, 68, 58, 1);
      }
      .btn-primary {
        background-color: #263445;
        color: #dce2e8;
      }
      .btn-secondary {
        background-color: #e1e8df;
      }
      .btn-outline {
        background-color: #eae1d7;
        border: 2px solid #374151;
      }
      .btn-send {
        background-color: #414141;
        color: #e5e5e5;
      }
      .btn:hover {
        transform: scale(1.05);
      }
      .btn-primary:hover {
        background-color: #3b5068;
      }
      .btn-secondary:hover {
        background-color: #c5d3c1;
      }
      .btn-outline:hover {
        background-color: #d5c8b9;
      }
      .btn-send:hover {
        background-color: #595959;
      }
    </style>
  </head>
  <body>
    <main>
      <h2>Button-set</h2>

      <div class="button-group">
        <a class="btn btn-primary">Lihat Proyek</a>
        <a class="btn btn-secondary">Unduh CV</a>
        <a class="btn btn-outline">Hubungi Saya</a>
        <a class="btn btn-send">Kirim Pesan</a>
      </div>
    </main>

    <footer>
      <a href="../index.html">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
