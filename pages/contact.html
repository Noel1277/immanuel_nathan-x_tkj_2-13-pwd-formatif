<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contant</title>
    <style>
        body {
            background-color: #f4f6f8;;
            font-family: arial, sans-serif;
        }
        #contant {
            padding: 40px 20px;
        }
        .contant-form {
            width: 400px;
            margin: auto;
            padding: 24px;
            border: 1px solid;
        }
        .contant-form h2 {
            text-align: center;
            color: #5089c2;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            font-weight: bold;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 8px;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: 2px solid #263445;
            background-color: #f0f4f8;
        }
        .btn-submit {
            background-color: #344C3D;
            border-radius: 6px;
            color: white;
            padding: 8px;
        }
        .btn-submit:hover {
            background-color: #527A5B;
        }
        footer {
            text-align: center;
        }
    </style>
</head>
<body>
    <section id="contant">
        <form class="contant-form">
            <h2>Hubungi Saya</h2>
            <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email">
            </div>
            <div class="form-group">
                <label for="pesan">Pesan</label>
                <textarea id="pesan" rows="5"></textarea>
            </div>
            <button class="btn-submit">Kirim Pesan</button>
        </form>
    </section>

    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>
